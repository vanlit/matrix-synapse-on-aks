apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synapse-secrets
  namespace: matrix

  annotations:
    argocd.argoproj.io/sync-wave: "-20"

spec:
  refreshInterval: 1h

  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault

  target:
    name: synapse-secrets
    creationPolicy: Owner

  data:
    - secretKey: registration_shared_secret
      remoteRef:
        key: synapse-registration-secret

    - secretKey: macaroon_secret_key
      remoteRef:
        key: synapse-macaroon-secret

    - secretKey: form_secret
      remoteRef:
        key: synapse-form-secret

    - secretKey: turn_shared_secret
      remoteRef:
        key: turn-static-auth-secret

    - secretKey: postgres_username
      remoteRef:
        key: matrix-postgres-username

    - secretKey: postgres_password
      remoteRef:
        key: postgres-password

    - secretKey: redis_password
      remoteRef:
        key: redis-password
