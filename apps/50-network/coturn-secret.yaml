apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coturn-secret
  namespace: calls

spec:
  refreshInterval: 1h

  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault

  target:
    name: coturn-secret
    creationPolicy: Owner

  data:
    - secretKey: turn-secret
      remoteRef:
        key: turn-static-auth-secret
