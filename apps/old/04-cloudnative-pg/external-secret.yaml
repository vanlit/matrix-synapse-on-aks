apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-db-auth
  namespace: 
  annotations:
    argocd.argoproj.io/sync-wave: "20"

spec:
  refreshInterval: 1h

  secretStoreRef:
    kind: ClusterSecretStore
    name: 

  target:
    name: matrix-db-auth
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth

  data:
    - secretKey: username
      remoteRef:
        key: 

    - secretKey: password
      remoteRef:
        key: 